# SpeedtestServer — tuning buffer TCP untuk path high-BDP (audit 27 Nov 2026)
# Diterapkan di VPS sebagai /etc/sysctl.d/99-speedtest-tuning.conf
# Efek terukur (kontrol lokal): DL 459,0 -> 472,8 Mbps pada path 63 ms.
# Pasang manual: sudo cp config/99-speedtest-tuning.conf /etc/sysctl.d/ && sudo sysctl -p /etc/sysctl.d/99-speedtest-tuning.conf
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
