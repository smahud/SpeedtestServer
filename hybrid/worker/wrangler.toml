name = "speedtest-hybrid-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Pilot di workers.dev (K-4). Custom Domain hanya setelah persetujuan operator.
workers_dev = true
preview_urls = false

# Non-secret configuration. Set the shared HMAC secret OUTSIDE this file:
#   wrangler secret put HYBRID_SHARED_SECRET
# (minted by the VPS gateway — hybrid/gateway — and verified locally here).
[vars]
# OoklaServer.netgaugeVersionString compatibility banner.
VERSION_STRING = "2.11 (2.11.5) 2026-06-04.1737.7d0993d"
# OoklaServer.allowedDomains — drives CSP connect-src, crossdomain.xml and
# the CORS Origin filter. "*" (daemon default) or a comma-separated list.
ALLOWED_DOMAINS = "*"
# Strict daemon Host validation is redundant behind Cloudflare routing
# (SNI/Host are enforced before the Worker sees the request) — default off.
STRICT_HOST_VALIDATION = "false"
# Daemon websocket.frameSizeLimitBytes (5 MiB default).
WS_FRAME_LIMIT_BYTES = "5242880"
# G-4: per-request caps for Workers Free — initial values from the spec
# (16-25 MiB); FINAL values are set from the real-edge measurements
# (hybrid/lab/evidence/e-j-real-edge/, Fase C.3).
MAX_DOWNLOAD_BYTES = "26214400"
MAX_UPLOAD_BYTES = "26214400"
# G-7/K-7: daemon-parity legacy HTTP surface OFF in production.
LEGACY_HTTP_ENABLED = "false"
# Worker-pool identity (worker 1 = this canonical primary script). The pool
# siblings (speedtest-hybrid-worker-2..-N) override these at deploy time —
# see hybrid/worker/deploy-pool.sh.
WORKER_ID = "1"
WORKER_POOL_MAX = "1"    # overridden per pool deployment (e.g. "100")
WORKER_DEFLECT_CONCURRENCY = "6"

[observability]
enabled = true

# --- Worker uji (Fase C.2): open mode + legacy ON + cap 32 MiB -------------
# Deploy: wrangler deploy --env test ; hapus setelah pengukuran:
#   wrangler delete --env test
[env.test]
name = "speedtest-hybrid-worker-test"
workers_dev = true
preview_urls = false
# [vars] is NOT inherited by environments — every var is restated.
[env.test.vars]
VERSION_STRING = "2.11 (2.11.5) 2026-06-04.1737.7d0993d"
ALLOWED_DOMAINS = "*"
STRICT_HOST_VALIDATION = "false"
WS_FRAME_LIMIT_BYTES = "5242880"
MAX_DOWNLOAD_BYTES = "33554432" # 32 MiB: covers conformance (25,000,000 B) + measurement
MAX_UPLOAD_BYTES = "33554432"
LEGACY_HTTP_ENABLED = "true" # conformance legacy needs this surface
